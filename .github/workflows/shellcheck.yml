name: Shellcheck

on:
  push:
    branches: [main]
    paths:
      - '**.sh'
      - 'agents/**'
      - 'skills/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.agents/**'
      - 'CHANGELOG.md'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.sh'
      - 'agents/**'
      - 'skills/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.agents/**'
      - 'CHANGELOG.md'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          scandir: '.'
          ignore_paths: 'node_modules .git'

      - name: Installer regression test
        run: ./tests/install-test.sh

      - name: Manifest and directory-rule checks
        run: ./tests/manifest-test.sh
